version: 1.9

# any configs here can be overwriteen by code

name: crossval # version + YMD if empty

# data
filename: data/all_JPL_v5.csv
index_col: Datetime
data_col: Load
persist_col: 
persist_calc_days: 7    # int or False (then need a persist_col above)
remove_days: [5,6]      # (empty), weekends, weekdays, or list of ints
resample: 15min
emd: True
emd_export: False
results_dir: ./results/
clean_dir: True

# model
units_layers: [24,96]
dropout: [0.1,0.1]
n_in: 48
n_out: 144
batch_size: 256
features: [Load, Persist1Workday]
features_list_name: IMF
features_list_numbers: [3,4]
calendar_features: False

# training
epochs: 150
patience: 20
plots: #'hx'
verbose: 1
loss: mse
test_split: 0.05    # fraction of data remaining for testing
valid_split: 0.2    # of testing data, fraction remaining for validation
cross_val: 10       # int (k) or False

# testing
forecast_freq: 1h   # 1h or 1d
test_plots: False
test_output: False

# hyperparameter search
units1: [4,8,12,24,48,96,128,256] # units 1
units2: [0,4,8,12,24,48,96,128,256] # units 2
dropouts: [0, 0.1] #0,0.1] # dropout
ns: [12,24,48,96,192,288,384,480] # n_in
features_2D: [  ['Load'], # features
                ['Load','Persist1Workday'], # features
                ['Load','IMF3','IMF4'],
                ['Load','Persist1Workday','IMF3','IMF4'],
                #['Load','IMF1','IMF2','IMF3','IMF4','IMF5','IMF6','IMF7','IMF8','IMF9','IMF10'],
                #['Load','Persist1Workday','IMF1','IMF2','IMF3','IMF4','IMF5','IMF6','IMF7','IMF8','IMF9','IMF10'],
                ]

# etc
convert_to_json: False          